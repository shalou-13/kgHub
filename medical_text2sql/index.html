<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗 Text-to-SQL 系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .sql-display {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .results-table th,
        .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .results-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        
        .results-table tr:hover {
            background: #f9f9f9;
        }
        
        .error-message {
            background: #fee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            color: #c62828;
        }
        
        .success-message {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            color: #2e7d32;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .examples {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .examples h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .example-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .example-item:hover {
            background: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 医疗 Text-to-SQL 系统</h1>
            <p>将自然语言问题转换为 SQL 查询</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="question">请输入您的问题：</label>
                    <input type="text" id="question" placeholder="例如：统计2024年住院超过7天的成年患者人数">
                </div>
                
                <button class="btn-primary" id="queryBtn" onclick="submitQuery()">
                    查询
                </button>
            </div>
            
            <div class="examples">
                <h3>示例问题（点击使用）：</h3>
                <div class="example-item" onclick="useExample(this)">统计2024年住院超过7天的成年患者人数</div>
                <div class="example-item" onclick="useExample(this)">查询最近30天内有新冠肺炎诊断的患者数量</div>
                <div class="example-item" onclick="useExample(this)">统计糖尿病患者的平均年龄</div>
                <div class="example-item" onclick="useExample(this)">查询住院时间最长的前10位患者的基本信息</div>
                <div class="example-item" onclick="useExample(this)">统计男性和女性患者的住院次数</div>
            </div>
            
            <div id="results" class="results-section"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function useExample(element) {
            document.getElementById('question').value = element.textContent;
        }
        
        async function submitQuery() {
            const question = document.getElementById('question').value.trim();
            
            if (!question) {
                alert('请输入问题');
                return;
            }
            
            const resultsDiv = document.getElementById('results');
            const queryBtn = document.getElementById('queryBtn');
            
            // Show loading
            queryBtn.disabled = true;
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在生成和执行查询...</p></div>';
            
            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        max_examples: 5
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displaySuccess(data);
                } else {
                    displayError(data);
                }
            } catch (error) {
                displayError({ error: '请求失败：' + error.message });
            } finally {
                queryBtn.disabled = false;
            }
        }
        
        function displaySuccess(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<div class="success-message">✓ 查询成功！</div>';
            
            html += '<div class="sql-display">';
            html += '<strong>生成的 SQL：</strong><br>';
            html += escapeHtml(data.sql);
            html += '</div>';
            
            if (data.results && data.results.length > 0) {
                html += '<div>';
                html += `<p><strong>结果数量：</strong> ${data.result_count} 条</p>`;
                html += '<table class="results-table">';
                
                // Header
                html += '<thead><tr>';
                Object.keys(data.results[0]).forEach(key => {
                    html += `<th>${escapeHtml(key)}</th>`;
                });
                html += '</tr></thead>';
                
                // Body
                html += '<tbody>';
                data.results.slice(0, 100).forEach(row => {
                    html += '<tr>';
                    Object.values(row).forEach(value => {
                        html += `<td>${escapeHtml(String(value))}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody>';
                
                html += '</table>';
                html += '</div>';
            } else {
                html += '<p>查询结果为空</p>';
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function displayError(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<div class="error-message">';
            html += '✗ 查询失败<br>';
            html += escapeHtml(data.error || '未知错误');
            html += '</div>';
            
            if (data.sql) {
                html += '<div class="sql-display">';
                html += '<strong>生成的 SQL：</strong><br>';
                html += escapeHtml(data.sql);
                html += '</div>';
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Allow Enter key to submit
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitQuery();
            }
        });
    </script>
</body>
</html>
